<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow is a simple responsive task manager built with HTML, CSS and JavaScript.">
  <title>TaskFlow — Simple Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
        <h1>TaskFlow</h1>
        <p class="subtitle">A clean task manager that keeps your day focused.</p>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">☾</button>
    </header>

    <section class="panel" aria-label="Add a task">
      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" maxlength="100" placeholder="What needs to be done?" autocomplete="off" required>
        <button type="submit">Add task</button>
      </form>
      <div class="stats">
        <span id="taskCount">0 tasks</span>
        <button id="clearCompleted" class="text-button" type="button">Clear completed</button>
      </div>
    </section>

    <section class="toolbar" aria-label="Task filters">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="active" type="button">Active</button>
        <button class="filter" data-filter="completed" type="button">Completed</button>
      </div>
      <button id="clearAll" class="text-button danger" type="button">Clear all</button>
    </section>

    <ul id="taskList" class="task-list" aria-live="polite"></ul>
    <p id="emptyState" class="empty-state">No tasks yet. Add your first task above.</p>

    <footer>
      <span>Built with HTML, CSS & JavaScript</span>
      <span>Data stays in your browser</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
